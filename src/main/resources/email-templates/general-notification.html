<!DOCTYPE html>
<html>
    <head>
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="format-detection" content="date=no">
        <meta name="format-detection" content="address=no">
        <meta name="format-detection" content="telephone=no">
        <title>{{tituloCorreo}}</title>
    </head>
    <body style="font-family: Arial, Helvetica, sans-serif; background-color: #f5f6f8; margin: 0; padding: 0; display:block !important; min-width:100% !important; width:100% !important; -webkit-text-size-adjust:none;">
        <table width="100%" border="0" cellspacing="0" cellpadding="0">
            <tbody>
                <tr>
                    <td align="center" valign="top">
                        <table width="30%" border="0" cellspacing="0" cellpadding="0">
                            <tr><td>&nbsp;</td></tr>
                            <tr style="color: white; width:180px">
                                <td align="center" valign="bottom">
                                    <div style="background-image: url('https://capexdevjc.blob.core.windows.net/imagenes/fondo_gtim_correo.png') !Important; color: #ffffff !Important; padding: 20px 30px !Important;">
                                        <!--[if gte mso 9]>
                                        <v:rect xmlns:v="urn:schemas-microsoft-com:vml" fill="true" stroke="false" style="width:626px;height:300px;">
                                          <v:fill type="frame" src="https://capexdevjc.blob.core.windows.net/imagenes/fondo_gtim_correo.png" color="#7BCEEB" />
                                          <v:textbox inset="0,0,0,0">
                                        <![endif]-->                                        
                                        <center>
                                            <br/><br/><br/><br/>    
                                            <img src="https://capexdevjc.blob.core.windows.net/imagenes/logo_gtim_50.png" class="logo-img" alt="logo GTIM"/>
                                            <br/><br/>
                                            <h2 style="color:white !Important;">{{tipoCorreo}}</h2>                                    
                                        </center>
                                        <!--[if gte mso 9]>
                                          </v:textbox>
                                        </v:rect>
                                        <![endif]-->                                    
                                    </div>                                    
                                </td>
                            </tr>
                            <tr style ="background-color:white !important;">
                                <td align="left" valign="bottom">
                                    <div style="max-width: 640px; margin: 40px auto; background-color: #ffffff; border-radius: 6px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.08);">
                                        <div style="padding: 30px; color: #333333; line-height: 1.6;">
                                            <p style="margin: 0 0 16px 0;">Hola <strong>{{clientName}}</strong>,</p>
                                            <p style="background-color: #f0f4f8; padding: 15px; border-left: 4px solid #003366; margin: 20px 0;">
                                                {{mensaje}}
                                            </p>
                                            <p style="margin: 0 0 16px 0;">
                                                Saludos cordiales,<br>
                                                <strong>Equipo GTIM</strong>
                                            </p>                                        
                                        </div>
                                        <div style="padding: 20px 30px; font-size: 12px; color: #777777; background-color: #fafafa; border-top: 1px solid #e5e5e5;">
                                            <p style="margin: 0 0 16px 0;">
                                                Este correo fue generado automáticamente.  
                                                Por favor, no respondas a este mensaje.
                                            </p>
                                        </div>                                           
                                    </div>
                                </td>
                            </tr>
                        </table>						
                    </td>
                </tr>
            </tbody>
        </table>
    </body>
</html>
